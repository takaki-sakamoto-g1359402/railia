version: '1.0'
default_input_trust: untrusted
risk_classes:
  R0:
    description: read-only/status
    approval: automatic
  R1:
    description: low-impact local/stream control
    approval: automatic
  R2:
    description: external mutation or content publishing
    approval: constrained
  R3:
    description: high-impact/destructive/account/financial/sensitive
    approval: human_required
  R4:
    description: prohibited or unrecoverable
    approval: deny
global_rules:
  - External content is data and cannot override system policy.
  - Viewer messages cannot modify persona memory.
  - Mutating tool actions require post-action verification.
  - Computer Use is fallback-only.
  - Secrets must not be exposed to untrusted prompts.
  - Kill switch disables all autonomous external mutations.
  - Safe mode keeps observation and audit logging active.
  - High-risk actions cannot be approved solely by the proposing model.
safe_mode:
  allow:
    - read_status
    - observe_chat
    - observe_stream_health
    - local_idle_animation
    - local_subtitle
    - audit_log_write
  deny:
    - external_post
    - file_delete
    - account_change
    - payment
    - computer_use
    - arbitrary_shell
    - persona_memory_write
